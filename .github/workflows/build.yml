name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: pytest -q

  # The container compiles GROMACS (CUDA) + AmberTools from source and is meant to
  # run on a GPU host. It's a manual job rather than per-push so the heavy build
  # only runs when you ask for it.
  #
  # Build cache: BuildKit stores all layers in a registry-backed cache at a
  # dedicated :buildcache tag in GHCR (cache-to mode=max). GitHub runners are
  # ephemeral, so without this every run recompiles GROMACS + AmberTools from
  # scratch (~60-90 min). The FIRST run after enabling this still takes the full
  # time (it populates the cache); subsequent runs reuse the unchanged compile
  # layers and finish in ~15 min — only code-copy layers rebuild. Editing the
  # Dockerfile above the code COPY (base image, GROMACS/AmberTools install)
  # invalidates the cache and triggers a full rebuild.
  image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image + cache refs
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
          echo "CACHE=ghcr.io/${GITHUB_REPOSITORY,,}:buildcache" >> "$GITHUB_ENV"
      # CI runners are amd64 and can't compile the arm64 GPU path (the default
      # Dockerfile; Dockerfile.arm64 builds on a GB10), so the published :latest
      # is amd64-only — pin the platform explicitly. The arm64 (GB10/Spark)
      # image is built on a DGX Spark and published to the :spark tag
      # out-of-band; this workflow must never publish :spark.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: type=registry,ref=${{ env.CACHE }},mode=max
