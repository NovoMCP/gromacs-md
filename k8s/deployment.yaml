# Reference Kubernetes manifest for gromacs-md (the always-on HTTP service).
# Adjust namespace, image, GPU node scheduling, and (optional) auth/redis for
# your cluster. Long MD runs are better dispatched as Jobs — see job-template.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gromacs-md
  labels: { app: gromacs-md }
spec:
  replicas: 1
  selector: { matchLabels: { app: gromacs-md } }
  template:
    metadata: { labels: { app: gromacs-md } }
    spec:
      # Schedule onto a GPU node. Match to your cluster's GPU taint/labels.
      # tolerations:
      #   - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: gromacs-md
          image: ghcr.io/novomcp/gromacs-md:latest
          ports: [ { containerPort: 8024 } ]
          env:
            - { name: PORT, value: "8024" }
            - { name: MAX_CONCURRENT_SIMS, value: "3" }
            - { name: NTOMP, value: "8" }
            # Optional job tracking. Omit for in-memory only:
            # - { name: REDIS_URL, value: "redis://redis:6379/0" }
            # Optional S3 results bucket. Omit to keep results on local disk:
            # - { name: MD_RESULTS_BUCKET, value: "your-md-results-bucket" }
            # - { name: AWS_REGION, value: "us-east-1" }
            # Optional inbound auth — omit for no auth (private network):
            # - name: API_KEY
            #   valueFrom: { secretKeyRef: { name: gromacs-md, key: api-key } }
          resources:
            limits: { nvidia.com/gpu: "1" }
            requests: { cpu: "4", memory: "8Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8024 }
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gromacs-md
  labels: { app: gromacs-md }
spec:
  selector: { app: gromacs-md }
  ports: [ { name: http, port: 8024, targetPort: 8024 } ]
